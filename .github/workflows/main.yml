name: Validation

on:
  push:
    branches: [ "main" ]

jobs:
  disk_check:
    runs-on: ubuntu-latest
    steps: 
      - name: disk check
        run : df -h
  
  git_check:
    runs-on: ubuntu-latest
    steps:
      - name: Git version
        run: git --version
  deployment:
    runs-on: ubuntu-latest
    needs: [ "disk_check", "git_check" ]
    steps:
      - name: Deployment
        run: echo "Deployment step executed"


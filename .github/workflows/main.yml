name: artifact-demo

on:
  push:
    branches: [ "main" ]

jobs:
  create_report:
    runs-on: ubuntu-latest
    steps:
      - name: Directory
        run: mkdir reports
        
      - name: Date & Time
        run: date > reports/system-report.txt
      
      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: system-report
          path: reports/system-report.txt
  read_report:
    runs-on: ubuntu-latest
    needs: create_report
    steps:
       - name: Download Artifacts
         uses: actions/download-artifact@v4
         with:
           name: system-report
           path: reports    
       - name: Content
         run : cat reports/system-report.txt

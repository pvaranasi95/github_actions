name: Diagnostics

on:
  push:
    branches: [ "main" ]
    
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Git Version
        run: git --version
      - name: Disk Usage
        run: df-h
  diagnostics:
    runs-on: ubuntu-latest
    needs: validation
    if: always()
    steps:
      - name: Collecting Diagnostic Information
        run: echo "Collecting diagnostic information"
      - name: Disk Usage
        run: df -h

name: job-condition

on:
  push:
    branches: [ "main", "develop" ]
    
jobs:
   validation:
    runs-on: ubuntu-latest
    steps:
      - name: Git Version
        run: git --version
      - name: Disk Usage
        run: df -h
   main_deployment:
    runs-on: ubuntu-latest
    needs: validation
    if: github.ref == 'refs/heads/main'
    steps:
      - name : Status  
        run: echo "Deploying from main branch"
    
   develop_validation:
    runs-on: ubuntu-latest
    needs: validation
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Branch Status
        run: echo "Running additional validation for develop"
          

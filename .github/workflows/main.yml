name: failure-cleanup

on:
  push:
    branches: [ "main" ]
 
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Git Version
        run: git --version
      - name: Disk Usage
        run: df-h
        
  cleanup:
    runs-on: ubuntu-latest
    needs: validation
    if: failure()
    steps:
      - name: Status
        run: echo "Validation failed. Starting cleanup process."
      - name: Disk Usage
        run: df -h

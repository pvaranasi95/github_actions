name: Validation

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Current date
        run: date
      
      - name: disk usage
        run : df -h
  
  deployment:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Validation status
        run: echo "Validation passed. Deployment can proceed."

